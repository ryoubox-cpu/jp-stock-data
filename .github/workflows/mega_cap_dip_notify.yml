name: Mega Cap Dip Screener

on:
  schedule:
    # 16:00 JST = 07:00 UTC（平日）。株価はYahooから直接取るので、
    # jp-stock-data の18時更新を待つ必要はない。終値確定＋Yahoo反映で16時。
    # GitHubの定時実行は数時間遅れることがあるが、株価が MAX_DATA_LAG_DAYS より
    # 古ければスクリプト側で通知を止める。
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 手動実行・DRY_RUN確認用

jobs:
  run-screener:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas jpholiday line-bot-sdk

      - name: Run screener
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          UNIVERSE_CSV: data/screener.csv
          MAX_DATA_LAG_DAYS: '4'   # 株価がこれより古ければ通知しない
          YF_WORKERS: '4'          # Yahooへの同時接続数。増やすと429を食らいやすい
          # auto: 定時実行は終値ベース、手動/外部トリガーは場中なら現在値を使う。
          # 1 で常に場中モード、0 で常に終値ベース。
          INTRADAY: auto
        run: |
          python mega_cap_dip_screener.py
