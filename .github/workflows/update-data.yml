name: update-data

on:
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      target:
        description: '何を取得するか'
        type: choice
        default: 'all'
        options: [all, prices, assets, universe, fundamentals, quarterly]
      full:
        description: '全期間を取り直す場合は 1'
        default: '0'
      stock_period:
        description: '個別株の取得期間（full=1のとき）例: 6y, 10y, max'
        default: '6y'
      rebuild_universe:
        description: 'ユニバースを作り直す場合は 1'
        default: '0'
      min_market_cap:
        description: '時価総額の下限（円）例: 800000000000=8000億, 100000000000=1000億'
        default: '800000000000'
      max_tickers:
        description: '銘柄数の上限（0で無制限）'
        default: '0'
      pause:
        description: '時価総額取得の間隔（秒）'
        default: '1.2'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build universe
        if: ${{ github.event.inputs.rebuild_universe == '1' || github.event.inputs.target == 'universe' || github.event.schedule == '0 6 1 * *' }}
        env:
          MIN_MARKET_CAP: ${{ github.event.inputs.min_market_cap || '800000000000' }}
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '0' }}
          PAUSE: ${{ github.event.inputs.pause || '1.2' }}
        run: python build_universe.py || echo "ユニバース更新をスキップ（既存を維持）"

      # 重い株価取得の前に、ユニバースとキャッシュを先に保存しておく。
      # ここで保存しないと、後の工程が失敗したときに数時間分の作業が失われる。
      - name: Commit universe first
        if: ${{ always() && (github.event.inputs.rebuild_universe == '1' || github.event.inputs.target == 'universe' || github.event.schedule == '0 6 1 * *') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update universe"
          file_pattern: 'data/universe.csv data/market_cap_cache.json'

      - name: Fetch stock prices
        if: ${{ github.event.inputs.target != 'assets' && github.event.inputs.target != 'universe' && github.event.inputs.target != 'fundamentals' && github.event.inputs.target != 'quarterly' }}
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
          PERIOD: ${{ github.event.inputs.full == '1' && (github.event.inputs.stock_period || '6y') || '3mo' }}
        run: python fetch_prices.py

      - name: Fetch fundamentals (PER/PBR)
        if: ${{ github.event.inputs.target == 'fundamentals' || github.event.inputs.target == 'all' || github.event.schedule == '0 6 1 * *' }}
        env:
          PAUSE: ${{ github.event.inputs.pause || '1.5' }}
        run: python fetch_fundamentals.py || echo "ファンダメンタル取得をスキップ"

      - name: Fetch quarterly EPS/BPS
        if: ${{ github.event.inputs.target == 'quarterly' }}
        env:
          PAUSE: ${{ github.event.inputs.pause || '2.0' }}
        run: python fetch_quarterly.py || echo "四半期データ取得をスキップ"

      - name: Fetch indices and sector ETFs
        if: ${{ github.event.inputs.target != 'prices' && github.event.inputs.target != 'universe' && github.event.inputs.target != 'fundamentals' && github.event.inputs.target != 'quarterly' }}
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
          PERIOD: ${{ github.event.inputs.full == '1' && 'max' || '3mo' }}
        run: python fetch_assets.py

      - name: Check file sizes
        if: always()
        run: |
          echo "--- 100MBを超えるファイルがないか確認 ---"
          find data -type f -size +95M -exec ls -lh {} \; || true
          BIG=$(find data -type f -size +95M | wc -l)
          if [ "$BIG" -gt 0 ]; then
            echo "::warning::95MBを超えるファイルがあります。pushが失敗する可能性があります"
          fi
          du -sh data || true

      - name: Commit data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update (${{ github.event.inputs.target || 'scheduled' }})"
          file_pattern: 'data/*'
