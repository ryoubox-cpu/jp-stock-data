name: update-data

on:
  schedule:
    - cron: '0 9 * * 1-5'     # 平日 JST 18:00 … 株価とETFの差分更新のみ
    - cron: '0 6 1 * *'       # 毎月1日 JST 15:00 … ユニバースとPER等の更新
  workflow_dispatch:
    inputs:
      target:
        description: '何を取得するか'
        type: choice
        default: 'all'
        options: [all, prices, assets, universe, fundamentals, quarterly, eps, diagnose, diagnose2, diagnose3]
      full:
        description: '全期間を取り直す場合は 1'
        default: '0'
      stock_period:
        description: '個別株の取得期間（full=1のとき）例: 6y, 10y, max'
        default: 'max'
      rebuild_universe:
        description: 'ユニバースを作り直す場合は 1'
        default: '0'
      min_market_cap:
        description: '時価総額の下限（円）例: 100000000000=1000億'
        default: '100000000000'
      max_tickers:
        description: '銘柄数の上限（0で無制限）'
        default: '800'
      pause:
        description: '1銘柄ずつ取得する処理の間隔（秒）'
        default: '2.0'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  # 手動実行なら入力値、スケジュールなら 'scheduled' を入れる。
  # 否定形（!= 'xxx'）で書くと、スケジュール時に空文字が全条件を通過して
  # 意図しない処理まで走るため、必ず肯定形で判定する。
  T: ${{ github.event.inputs.target || 'scheduled' }}
  DAILY: ${{ github.event.schedule == '0 9 * * 1-5' }}
  MONTHLY: ${{ github.event.schedule == '0 6 1 * *' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # 実行前に必要なファイルの存在を確かめる（今回の失敗の再発防止）
      - name: Check required files
        run: |
          MISSING=0
          for f in build_universe.py fetch_prices.py fetch_assets.py \
                   fetch_fundamentals.py fetch_eps.py requirements.txt; do
            if [ ! -f "$f" ]; then echo "::warning::$f がありません"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "不足ファイルがあります。該当する処理はスキップされます"
          else
            echo "必要なファイルはすべて揃っています"
          fi

      - name: Build universe
        if: ${{ env.T == 'universe' || env.T == 'all' || github.event.inputs.rebuild_universe == '1' || env.MONTHLY == 'true' }}
        env:
          MIN_MARKET_CAP: ${{ github.event.inputs.min_market_cap || '100000000000' }}
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '800' }}
          PAUSE: ${{ github.event.inputs.pause || '2.0' }}
        run: |
          if [ -f build_universe.py ]; then
            python build_universe.py || echo "::warning::ユニバース更新に失敗（既存を維持）"
          else
            echo "build_universe.py がないためスキップ"
          fi

      - name: Commit universe first
        if: ${{ always() && (env.T == 'universe' || env.T == 'all' || github.event.inputs.rebuild_universe == '1' || env.MONTHLY == 'true') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update universe"
          file_pattern: 'data/universe.csv data/market_cap_cache.json'

      - name: Fetch stock prices
        if: ${{ env.T == 'prices' || env.T == 'all' || env.DAILY == 'true' }}
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
          PERIOD: ${{ github.event.inputs.full == '1' && (github.event.inputs.stock_period || 'max') || '3mo' }}
        run: |
          if [ -f fetch_prices.py ]; then python fetch_prices.py
          else echo "::warning::fetch_prices.py がないためスキップ"; fi

      - name: Fetch indices and sector ETFs
        if: ${{ env.T == 'assets' || env.T == 'all' || env.DAILY == 'true' }}
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
          PERIOD: ${{ github.event.inputs.full == '1' && 'max' || '3mo' }}
        run: |
          if [ -f fetch_assets.py ]; then python fetch_assets.py
          else echo "::warning::fetch_assets.py がないためスキップ"; fi

      - name: Fetch fundamentals (PER/PBR)
        if: ${{ env.T == 'fundamentals' || env.T == 'all' || env.MONTHLY == 'true' }}
        env:
          PAUSE: ${{ github.event.inputs.pause || '2.0' }}
        run: |
          if [ -f fetch_fundamentals.py ]; then
            python fetch_fundamentals.py || echo "::warning::PER/PBR取得に失敗"
          else echo "::warning::fetch_fundamentals.py がないためスキップ"; fi

      - name: Fetch EPS history
        if: ${{ env.T == 'eps' }}
        env:
          PAUSE: ${{ github.event.inputs.pause || '2.0' }}
        run: |
          if [ -f fetch_eps.py ]; then python fetch_eps.py
          else echo "::warning::fetch_eps.py がないためスキップ"; fi

      - name: Fetch quarterly EPS/BPS
        if: ${{ env.T == 'quarterly' }}
        env:
          PAUSE: ${{ github.event.inputs.pause || '2.0' }}
        run: |
          if [ -f fetch_quarterly.py ]; then
            python fetch_quarterly.py || echo "::warning::四半期取得に失敗"
          else echo "::warning::fetch_quarterly.py がないためスキップ"; fi

      - name: Diagnose
        if: ${{ env.T == 'diagnose' || env.T == 'diagnose2' || env.T == 'diagnose3' }}
        run: |
          case "${{ env.T }}" in
            diagnose)  F=diagnose_quarterly.py ;;
            diagnose2) F=diagnose_history.py ;;
            diagnose3) F=diagnose_eps.py ;;
          esac
          if [ -f "$F" ]; then python "$F" "${{ github.event.inputs.pause || '1.5' }}"
          else echo "::warning::$F がないためスキップ"; fi

      - name: Check file sizes
        if: always()
        run: |
          find data -type f -size +95M -exec ls -lh {} \; || true
          BIG=$(find data -type f -size +95M 2>/dev/null | wc -l)
          if [ "$BIG" -gt 0 ]; then
            echo "::warning::95MBを超えるファイルがあります。pushが失敗する可能性があります"
          fi
          du -sh data || true

      - name: Commit data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update (${{ env.T }})"
          file_pattern: 'data'
