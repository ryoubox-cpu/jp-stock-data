name: update-data

on:
  schedule:
    - cron: '0 9 * * 1-5'     # 平日 JST 18:00 … 差分更新
    - cron: '0 6 1 * *'       # 毎月1日 JST 15:00 … ユニバース作り直し
  workflow_dispatch:
    inputs:
      target:
        description: '何を取得するか'
        type: choice
        default: 'all'
        options: [all, prices, assets]
      full:
        description: '全期間を取り直す場合は 1（既存データは破棄して再取得）'
        default: '0'
      stock_period:
        description: '個別株の取得期間（full=1のとき）例: 6y, 10y, max'
        default: '6y'
      rebuild_universe:
        description: 'ユニバースを作り直す場合は 1'
        default: '0'
      min_market_cap:
        description: '時価総額の下限（円）例: 800000000000=8000億, 100000000000=1000億'
        default: '800000000000'
      max_tickers:
        description: '銘柄数の上限（0で無制限）'
        default: '0'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build universe
        if: ${{ github.event.inputs.rebuild_universe == '1' || github.event.schedule == '0 6 1 * *' }}
        env:
          MIN_MARKET_CAP: ${{ github.event.inputs.min_market_cap || '800000000000' }}
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '0' }}
        run: python build_universe.py || echo "ユニバース更新をスキップ（既存を維持）"

      - name: Fetch stock prices
        if: ${{ github.event.inputs.target != 'assets' }}
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
          PERIOD: ${{ github.event.inputs.full == '1' && (github.event.inputs.stock_period || '6y') || '3mo' }}
        run: python fetch_prices.py

      - name: Fetch indices and sector ETFs
        if: ${{ github.event.inputs.target != 'prices' }}
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
          PERIOD: ${{ github.event.inputs.full == '1' && 'max' || '3mo' }}
        run: python fetch_assets.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update (${{ github.event.inputs.target || 'scheduled' }})"
          file_pattern: 'data/*'
